name: C CI

on:
  push:
    branches: [ "master" ]
    tags:
      - v*
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Clean
      run: make clean
    - name: Test
      run: make test
    - name: Build
      run: make package
    - name: Upload
      if: github.ref_type == 'tag'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release create ${{github.ref_name}} -t "Test Release Pipeline" -d scpgame.zip
