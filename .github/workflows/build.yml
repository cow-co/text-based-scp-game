name: C CI

on:
  push:
    branches: [ "master" ]
    tags:
      - v*
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v4
    - name: Clean
      run: make clean
    - name: Test
      run: make test
    - name: Build
      run: make package
    - name: Upload
      uses: xresloader/upload-to-github-release@v1
      if: github.ref_type == 'tag'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        file: 'scpgame.zip'
        tags: true
        draft: true
