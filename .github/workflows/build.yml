name: C CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v4
    - name: Clean
      run: make clean
    - name: Test
      run: make test
    - name: Build
      run: make package
    - name: Upload
      uses: softprops/action-gh-release@v3
      if: github.ref_type == 'tag'
      with:
        files: 'scpgame.zip'
