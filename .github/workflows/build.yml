name: C CI

on:
  push:
    branches: [ "master" ]
    tags:
      - v*
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v4
    - name: Clean
      run: make clean
    - name: Test
      run: make test
    - name: Build
      run: make package
    - name: Upload
      uses: svenstaro/upload-release-action@v2
      if: github.ref_type == 'tag'
      with:
        file: scpgame.zip
        asset_name: scpgame.zip
        tag: ${{ github.ref }}
        overwrite: true
        body: "Release text"
