name: C CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  tags:
    - v*

jobs:
  build:

    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v4
    - name: Clean
      run: make clean
    - name: Test
      run: make test
    - name: Build
      run: make package
    - name: Upload
      uses: svenstaro/upload-release-action@v2
      if: github.ref_type == 'tag'
      with:
        files: 'scpgame.zip'
